<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 30px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #64748b; }
      .node-title { font: 700 18px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #0f172a; }
      .node-text { font: 400 15px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #334155; }
      .small { font: 400 13px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #64748b; }
      .edge-label { font: 600 14px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #475569; }
      .box { stroke-width: 2; rx: 14; filter: url(#shadow); }
      .arrow { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 8 6; }
    </style>
  </defs>

  <rect width="1600" height="1120" fill="#f8fafc"/>
  <text x="800" y="52" text-anchor="middle" class="title">balloon_fill 自动断句路径</text>
  <text x="800" y="82" text-anchor="middle" class="subtitle">当前渲染流程：气泡蒙版 → 可用矩形 → 枚举行/列组合 → 测量形状匹配 → 最终蒙版校验</text>

  <!-- Main flow -->
  <rect x="590" y="120" width="420" height="70" class="box" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="800" y="151" text-anchor="middle" class="node-title">resize_regions_to_font_size</text>
  <text x="800" y="176" text-anchor="middle" class="node-text">遍历 region，并设置 config._current_region</text>

  <path d="M800 190 L800 225" class="arrow"/>
  <rect x="640" y="225" width="320" height="66" class="box" fill="#fff7ed" stroke="#f97316"/>
  <text x="800" y="254" text-anchor="middle" class="node-title">读取 region.translation</text>
  <text x="800" y="278" text-anchor="middle" class="node-text">检查是否已有 [BR] / &lt;br&gt;</text>

  <path d="M640 258 L390 258 L390 315" class="arrow"/>
  <text x="505" y="246" text-anchor="middle" class="edge-label">有 BR</text>
  <rect x="190" y="315" width="400" height="82" class="box" fill="#dcfce7" stroke="#22c55e"/>
  <text x="390" y="348" text-anchor="middle" class="node-title">保留显式断点</text>
  <text x="390" y="374" text-anchor="middle" class="node-text">不进入自动无 BR 断句</text>

  <path d="M960 258 L1210 258 L1210 315" class="arrow"/>
  <text x="1085" y="246" text-anchor="middle" class="edge-label">无 BR</text>
  <rect x="1010" y="315" width="400" height="82" class="box" fill="#fef3c7" stroke="#eab308"/>
  <text x="1210" y="348" text-anchor="middle" class="node-title">判断 balloon_fill 蒙版布局</text>
  <text x="1210" y="374" text-anchor="middle" class="node-text">mode + balloon_fill_mask_layout</text>

  <!-- Mask off branch -->
  <path d="M1010 356 L770 356 L770 450" class="arrow"/>
  <text x="890" y="344" text-anchor="middle" class="edge-label">未启用</text>
  <rect x="570" y="450" width="400" height="82" class="box" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="770" y="483" text-anchor="middle" class="node-title">使用 OCR 区域尺寸</text>
  <text x="770" y="509" text-anchor="middle" class="node-text">region.unrotated_size</text>

  <!-- Mask on branch -->
  <path d="M1210 397 L1210 450" class="arrow"/>
  <text x="1238" y="427" class="edge-label">已启用</text>
  <rect x="1010" y="450" width="400" height="82" class="box" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="1210" y="483" text-anchor="middle" class="node-title">生成 region_bubble_mask</text>
  <text x="1210" y="509" text-anchor="middle" class="node-text">_build_region_reference_mask</text>

  <path d="M1210 532 L1210 570" class="arrow"/>
  <polygon points="1210,570 1320,625 1210,680 1100,625" fill="#fff7ed" stroke="#f97316" stroke-width="2" filter="url(#shadow)"/>
  <text x="1210" y="620" text-anchor="middle" class="node-title">OCR lines 完全</text>
  <text x="1210" y="645" text-anchor="middle" class="node-title">位于蒙版内?</text>

  <path d="M1100 625 L770 625 L770 700" class="arrow"/>
  <text x="920" y="613" text-anchor="middle" class="edge-label">否</text>
  <rect x="570" y="700" width="400" height="82" class="box" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="770" y="733" text-anchor="middle" class="node-title">跳过蒙版排版</text>
  <text x="770" y="759" text-anchor="middle" class="node-text">后续 balloon_fill 降级 strict</text>

  <path d="M1320 625 L1450 625 L1450 700" class="arrow"/>
  <text x="1380" y="613" text-anchor="middle" class="edge-label">是</text>
  <rect x="1250" y="700" width="400" height="82" class="box" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="1450" y="733" text-anchor="middle" class="node-title">find_largest_inscribed_rect</text>
  <text x="1450" y="759" text-anchor="middle" class="node-text">最大矩形：histogram + 单调栈</text>

  <path d="M1450 782 L1450 835 L970 835" class="arrow"/>
  <text x="1370" y="823" text-anchor="middle" class="edge-label">得到 layout_width / layout_height</text>
  <path d="M770 782 L770 835" class="arrow"/>

  <!-- Converged layout -->
  <rect x="570" y="835" width="400" height="82" class="box" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="770" y="868" text-anchor="middle" class="node-title">_solve_unified_no_br_layout</text>
  <text x="770" y="894" text-anchor="middle" class="node-text">传入可用布局矩形尺寸</text>

  <path d="M770 917 L770 952" class="arrow"/>
  <rect x="570" y="952" width="400" height="82" class="box" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="770" y="985" text-anchor="middle" class="node-title">枚举行数 / 列数组合</text>
  <text x="770" y="1011" text-anchor="middle" class="node-text">使用现有测量算法，选择最接近矩形形状的布局</text>

  <path d="M970 993 L1130 993" class="arrow"/>
  <rect x="1130" y="952" width="400" height="82" class="box" fill="#dcfce7" stroke="#22c55e"/>
  <text x="1330" y="985" text-anchor="middle" class="node-title">生成自动 [BR]</text>
  <text x="1330" y="1011" text-anchor="middle" class="node-text">字号仅参与文字测量和最终渲染</text>

  <path d="M1330 1034 L1330 1070" class="arrow"/>
  <rect x="1130" y="1070" width="400" height="42" class="box" fill="#fef3c7" stroke="#eab308"/>
  <text x="1330" y="1097" text-anchor="middle" class="node-text">最终检查渲染框是否完全位于气泡蒙版内</text>

  <!-- Legend -->
  <rect x="60" y="900" width="350" height="150" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="85" y="930" class="node-title">当前职责划分</text>
  <circle cx="92" cy="962" r="7" fill="#8b5cf6"/>
  <text x="112" y="968" class="node-text">气泡蒙版：提供最大可用矩形</text>
  <circle cx="92" cy="992" r="7" fill="#0284c7"/>
  <text x="112" y="998" class="node-text">OCR lines：仅保留 line=1 特殊判断</text>
  <circle cx="92" cy="1022" r="7" fill="#22c55e"/>
  <text x="112" y="1028" class="node-text">字号：测量与渲染约束</text>
</svg>
