name: Upload Hayai OCR v2 to ModelScope

on:
  workflow_dispatch:
    inputs:
      commit_message:
        description: ModelScope commit message
        required: false
        default: Upload Hayai OCR v2 model
        type: string

concurrency:
  group: upload-hayai-ocr-v2-modelscope
  cancel-in-progress: false

permissions:
  contents: read

env:
  MODELSCOPE_REPO: hgmzhn/manga-translator-ui
  MODELSCOPE_PATH: hayai-ocr-v2
  HF_REPO: JustANormalTinkerer/hayai-ocr-v2
  HF_REVISION: 4a4ce477c9a8841f208b94e1d9ed5c0938965e05

jobs:
  upload:
    name: Upload Hayai OCR v2 model files
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Validate ModelScope token
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          if [ -z "$MODELSCOPE_TOKEN" ]; then
            echo "Missing required secret: MODELSCOPE_TOKEN"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ModelScope CLI
        run: python -m pip install --disable-pip-version-check --no-input modelscope

      - name: Log in to ModelScope
        shell: bash
        env:
          MODELSCOPE_SDK_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from modelscope.hub.api import HubApi

          api = HubApi()
          api.login(os.environ["MODELSCOPE_SDK_TOKEN"])
          print("ModelScope login succeeded")
          PY

      - name: Download and verify Hayai OCR v2 files
        shell: bash
        env:
          MODEL_DIR: ${{ runner.temp }}/hayai-ocr-v2
        run: |
          set -euo pipefail
          mkdir -p "$MODEL_DIR"

          download() {
            local path="$1"
            local destination="$MODEL_DIR/$path"
            mkdir -p "$(dirname "$destination")"
            curl --fail --location --retry 5 --retry-delay 10 --retry-all-errors \
              --user-agent "manga-translator-ui-model-uploader" \
              --output "$destination.part" \
              "https://huggingface.co/${HF_REPO}/resolve/${HF_REVISION}/${path}"
            mv "$destination.part" "$destination"
          }

          # README and custom modeling files are required for a usable Transformers model.
          download README.md
          download config.json
          download configuration_hayai.py
          download model.safetensors
          download modeling_hayai.py
          download tokenizer.json
          download tokenizer_config.json

          expected_size=622502784
          actual_size=$(stat -c '%s' "$MODEL_DIR/model.safetensors")
          if [ "$actual_size" -ne "$expected_size" ]; then
            echo "Unexpected model.safetensors size: $actual_size (expected $expected_size)"
            exit 1
          fi

          printf '%s  %s\n' \
            '4c645b221db8428cda04991be234c18133bb8861142a3d87cba04c5099b02328' \
            "$MODEL_DIR/model.safetensors" \
            | sha256sum --check --status

      - name: Upload Hayai OCR v2 to ModelScope
        shell: bash
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          MODELSCOPE_API_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          MODEL_DIR: ${{ runner.temp }}/hayai-ocr-v2
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          set -euo pipefail
          modelscope upload \
            "$MODELSCOPE_REPO" \
            "$MODEL_DIR" \
            "$MODELSCOPE_PATH"
            --repo-type model \
            --commit-message "$COMMIT_MESSAGE" \
            --token "$MODELSCOPE_TOKEN" \
            --max-workers 4
