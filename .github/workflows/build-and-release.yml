    - name: Bundle external runtime resources next to app
      run: |
        echo "Bundling runtime resources next to app.exe..."
        APP_VERSION="${GITHUB_REF_NAME#v}"
        echo "Embedding app version: ${APP_VERSION}"

        for variant in cpu gpu; do
          dist_dir="dist/manga-translator-${variant}"
          rm -rf \
            "$dist_dir/_internal/config" \
            "$dist_dir/_internal/examples" \
            "$dist_dir/_internal/fonts" \
            "$dist_dir/_internal/models" \
            "$dist_dir/_internal/dict" \
            "$dist_dir/_internal/doc" \
            "$dist_dir/_internal/desktop_qt_ui" \
            "$dist_dir/_internal/presets" \
            "$dist_dir/_internal/logs" \
            "$dist_dir/_internal/result"
          rm -f "$dist_dir/_internal/VERSION"
          rm -rf "$dist_dir/_internal/manga_translator/server/static"

          rm -rf "$dist_dir/config" "$dist_dir/fonts" "$dist_dir/models" \
            "$dist_dir/dict" "$dist_dir/doc" "$dist_dir/desktop_qt_ui" \
            "$dist_dir/manga_translator/server/static"
          cp -r config "$dist_dir/config"
          cp -r fonts "$dist_dir/fonts"
          cp -r dict "$dist_dir/dict"
          cp -r doc "$dist_dir/doc"
          mkdir -p "$dist_dir/desktop_qt_ui"
          cp -r desktop_qt_ui/locales "$dist_dir/desktop_qt_ui/locales"
          cp -r desktop_qt_ui/ui "$dist_dir/desktop_qt_ui/ui"
          mkdir -p "$dist_dir/manga_translator/server"
          cp -r manga_translator/server/static "$dist_dir/manga_translator/server/static"
          printf '%s\n' "$APP_VERSION" > "$dist_dir/VERSION"
        done

        cp -r models_cpu dist/manga-translator-cpu/models
        cp -r models_gpu dist/manga-translator-gpu/models

    - name: Create Release Archives using 7-Zip with Splitting
      run: |
        mkdir -p release_assets
        echo "Archiving CPU version..."
        cd dist/manga-translator-cpu/
        7z a -v1990m -m0=lzma2 -ms=on ../../release_assets/manga-translator-cpu-${{ github.ref_name }}.7z .
        cd ../../
        echo "CPU version archived. Deleting source directory to save space..."
        rm -rf dist/manga-translator-cpu
        echo "Archiving GPU version..."
        cd dist/manga-translator-gpu/
        7z a -v1990m -m0=lzma2 -ms=on ../../release_assets/manga-translator-gpu-${{ github.ref_name }}.7z .
        cd ../../
        echo "GPU version archived. Deleting source directory to save space..."
        rm -rf dist/manga-translator-gpu

