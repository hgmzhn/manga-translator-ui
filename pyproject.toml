# uv 依赖配置（替代 requirements_cpu/gpu/amd/metal.txt）
#
# 安装方式（四选一，dependency groups 互斥）:
#   uv sync                                      # 默认：NVIDIA CUDA 13.0 + 打包工具
#   uv sync --no-default-groups --group cpu      # CPU 版
#   uv sync --no-default-groups --group amd      # AMD 公共依赖
#   uv run --no-sync python packaging/launch.py --requirements amd --install-deps-only  # 安装 AMD ROCm torch
#   uv sync --no-default-groups --group metal    # macOS Apple Silicon (MPS) 版

[project]
name = "manga-translator-ui"
version = "1.7.6"
description = "Manga Image Translator UI"
requires-python = ">=3.12,<3.13"

dependencies = [
    "aiofiles==25.1.0",
    "aiohttp==3.14.3",
    "aioshutil==1.5",
    "albumentations==2.0.8",
    "arabic-reshaper==3.0.0",
    "backports.statistics==0.1.0",
    "colorama==0.4.6",
    "customtkinter==5.2.2",
    "einops==0.8.1",
    "fastapi==0.141.1",
    "fire==0.7.1",
    "fugashi==1.3.2",
    "hanlp==2.1.3",
    "python-multipart==0.0.32",
    "httpcore==1.0.9",
    "httpx>=0.28.1,<1.0.0",
    "ijson==3.4.0",
    "jaconv==0.3.4",
    "json5==0.9.28",
    "kornia==0.8.1",
    "langcodes==3.5.0",
    "loguru==0.7.3",
    "matplotlib==3.11.1",
    "networkx==3.5",
    "omegaconf==2.3.0",
    "openai==2.14.0",
    "curl_cffi>=0.7.0",
    "opencv-contrib-python>=4.10.0",
    "packaging<25.0",
    "pandas==2.3.1",
    "Pillow==12.3.0",
    "pillow-heif==1.5.0",
    "psutil==5.9.5",
    "py3langid==0.2.2",
    "pyclipper==1.3.0.post6",
    "pydantic==2.11.7",
    "pyperclip==1.9.0",
    "pythainlp[nlpo3]==5.3.1",
    "PyHyphen==4.0.4",
    "PyQt6==6.9.1",
    "PyQt6-Fluent-Widgets==1.11.2",
    "pytest==9.1.1",
    "python-dotenv==1.2.2",
    "rich==14.1.0",
    "safetensors==0.8.0",
    "spandrel==0.4.1",
    "scipy==1.16.1",
    # YOLO OBB / MangaLens 气泡检测运行时依赖 ultralytics
    "ultralytics==8.4.14",
    # sentencepiece 已移除，改用 tokenizers 库 (use_fast=True)
    "setuptools==83.0.0",
    "Shapely==2.1.1",
    "scikit-image==0.25.2",
    "starlette==1.3.1",
    "tiktoken==0.11.0",
    "timm==1.0.19",
    "transformers==5.14.1",
    "accelerate>=1.12.0",
    "tqdm==4.67.1",
    "unidic_lite==1.0.8",
    "uvicorn==0.35.0",
    "websockets==14.2",
    "anyio>=4.8.0",
    "google-genai==1.57.0",
    # pydensecrf 来源按平台选择，见 [tool.uv.sources]
    "pydensecrf",
    "torchsummary",
    "open_clip_torch==3.1.0",
    "python-bidi==0.6.6",
    "tufup==0.9.0",
    "google-cloud==0.34.0",
    # 简繁体中文转换
    "opencc-python-reimplemented==0.1.7",
    # PDF/EPUB/CBZ 压缩包支持
    "PyMuPDF==1.25.5",
    "rarfile==4.2",
    "py7zr==1.1.3",
    # Server 模块依赖
    "bcrypt==4.2.1",
    "cryptography==50.0.0",
    "APScheduler==3.10.4",
    "pytest-anyio==0.0.0",
]

[dependency-groups]
cpu = [
    "torch==2.13.0",
    "torchvision==0.28.0",
    "onnxruntime==1.28.0",
    "ctranslate2==4.8.1",
    "huggingface-hub==1.26.0",
    "numpy>=2.0,<2.3",
]
gpu = [
    "torch==2.13.0",
    "torchvision==0.28.0",
    "onnxruntime-gpu==1.28.0",
    "ctranslate2==4.8.1",
    "huggingface-hub==1.26.0",
    "numpy>=2.0,<2.3",
    "xformers==0.0.35",
]
# AMD ROCm: PyTorch 不在此处，由 packaging/launch.py 从 repo.radeon.com 两阶段安装
# (ROCm 7.2.1 SDK + torch/torchaudio/torchvision wheels，需 AMD 驱动 26.2.2，仅 Python 3.12)
# NumPy 与其他后端保持相同兼容上限
amd = [
    "onnxruntime==1.28.0",
    "ctranslate2==4.8.1",
    "huggingface-hub==1.26.0",
    "numpy>=2.0,<2.3",
]
metal = [
    # 使用默认 PyPI 源，自动安装 MPS 版本
    "torch==2.13.0",
    "torchvision==0.28.0",
    # macOS 不支持 GPU 版 onnxruntime
    "onnxruntime==1.28.0",
    "ctranslate2==4.8.1",
    "huggingface-hub==1.26.0",
    "numpy>=2.0,<2.3",
    # macOS 原生 Dock 图标支持（AppKit）
    "pyobjc-framework-Cocoa>=10.0",
]
packaging = [
    "pyinstaller==6.17.0",
    "pyinstaller-hooks-contrib==2025.9",
]

[tool.uv]
# 本项目按应用管理，不构建/安装自身
package = false
# 本仓库默认使用 NVIDIA GPU 环境，并保留项目打包工具
default-groups = ["gpu", "packaging"]
# 四种后端互斥，不能同时安装
conflicts = [
    [
        { group = "cpu" },
        { group = "gpu" },
        { group = "amd" },
        { group = "metal" },
    ],
]

[tool.uv.sources]
# torch 索引按 dependency group 绑定；metal 不绑定，回落到默认 PyPI（自动 MPS 版）
torch = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu130", group = "gpu" },
]
torchvision = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu130", group = "gpu" },
]
xformers = [
    { index = "pytorch-cu130", group = "gpu" },
]
# pydensecrf 按平台选择安装来源
# Windows/macOS: 预编译 wheel（避免本地编译失败）; Linux: 从源码安装（需 C++ 编译工具）
pydensecrf = [
    { url = "https://github.com/hgmzhn/manga-translator-ui/releases/download/v1.7.6/pydensecrf-1.0-cp312-cp312-win_amd64.whl", marker = "sys_platform == 'win32'" },
    { url = "https://github.com/hgmzhn/pydensecrf/releases/download/v1.0.0/pydensecrf-1.0-cp312-cp312-macosx_10_13_universal2.whl", marker = "sys_platform == 'darwin'" },
    { git = "https://github.com/lucasb-eyer/pydensecrf.git", marker = "sys_platform == 'linux'" },
]

# pydensecrf 无运行时依赖；直接声明元数据，避免 lock 时为 Linux 分支从 git 源码构建
[[tool.uv.dependency-metadata]]
name = "pydensecrf"
requires-dist = []

# HanLP 仍依赖已弃用的 pynvml 兼容包；nvidia-ml-py 提供同名模块，
# 可直接替代且不会在导入时产生弃用警告。
[[tool.uv.dependency-metadata]]
name = "hanlp"
version = "2.1.3"
requires-dist = [
    "hanlp-common>=0.0.23",
    "hanlp-downloader",
    "hanlp-trie>=0.0.4",
    "nvidia-ml-py>=12.0.0",
    "sentencepiece>=0.1.91",
    "termcolor",
    "toposort==1.5",
    "torch>=1.6.0",
    "transformers>=4.1.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
